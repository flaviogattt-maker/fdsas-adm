/* acabamento visual sofisticado */

.pie-layout{display:flex;align-items:center;justify-content:center;gap:24px;min-height:180px;padding:8px 4px}.pie-chart{width:178px;height:178px;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:0 0 0 1px #ffffff18,0 12px 25px #00000088}.pie-chart:after{content:'';position:absolute;inset:25px;border-radius:50%;background:#09090b;box-shadow:inset 0 1px #ffffff0b}.pie-center{position:relative;z-index:1;text-align:center;display:grid;gap:2px}.pie-center b{font-size:25px;color:#f7f7f8}.pie-center span{font-size:11px;color:#a1a1aa}.pie-legend{display:grid;gap:9px;min-width:145px}.pie-legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;font-size:12px}.pie-legend-row i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px #ffffff22}.pie-legend-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6d6db}.pie-legend-row b{color:#f7f7f8}@media(max-width:520px){.pie-layout{gap:15px}.pie-chart{width:145px;height:145px}.pie-chart:after{inset:21px}.pie-legend{min-width:120px}}

 class="small">Comparativo de produção</div></div><span class="eyebrow">Pedidos</span></div>${pieChart(userItems.slice(0,6),'orders')}<div class="chart-note"><span>Maior produção: ${userItems[0]?userItems[0].user.name:'—'}</span><b>${userItems[0]?userItems[0].orders:0} pedido(s)</b></div></div><div class="card"><div class="section-title"><div><h2>Volume por rota</h2><div class="small">Quantidade de unidades separadas</div></div><span class="eyebrow">Unidades</span></div>${barChart(routeItems,'qty','route')}<div class="chart-note"><span>Maior volume: ${((routeItems.slice().sort((a,b)=>b.qty-a.qty)[0]||{}).route||'—')}</span><b>${fmt(Math.max(...routeItems.map(x=>x.qty),0))} unidade(s)</b></div></div></div><div class="card" style="margin-top:15px"><div class="section-title"><div><h2>Produção por separador e rota</h2><div class="small">Pedidos por rota e unidades separadas por colaborador</div></div><span class="eyebrow">Pedidos</span></div>${separatorRouteChart(userItems)}</div><div class="grid layout" style="margin-top:15px"><div class="card"><div class="section-title"><div><h2>Ranking da equipe</h2><div class="small">Ordenado pelo número de pedidos</div></div><span class="eyebrow">${label}</span></div><div class="route-list">${ur.map((x,i)=>`<div class="route-row"><b>${i+1}º ${x.user.name}</b><div><span>${x.orders} pedido(s) • ${fmt(x.qty)} unidade(s)</span><div class="bar"><i style="width:${x.orders/maxU*100}%"></i></div></div><strong>${x.orders}</strong></div>`).join('')}</div></div><div class="card"><div class="section-title"><div><h2>Produção por rota</h2><div class="small">Pedidos e unidades produzidas</div></div></div><div class="route-list">${rr.map(x=>`<div class="route-row"><b>${x.route}</b><div><span>${x.orders} pedido(s) • ${fmt(x.qty)} unidade(s)</span><div class="bar"><i style="width:${x.qty/maxR*100}%"></i></div></div><strong>${fmt(x.qty)}</strong></div>`).join('')}</div></div></div><div class="grid layout" style="margin-top:15px"><div class="card"><di function slugify(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
function saveConfig(){localStorage.setItem('separacao_pro_users',JSON.stringify(users));localStorage.setItem('separacao_pro_routes',JSON.stringify(routes));localStorage.setItem('separacao_pro_archived_users',JSON.stringify(archivedUsers))}

function localDateTime(x){let d=new Date(x),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}

function saveEdit(){let id=window.editingId,data=getData(),entry=data.find(r=>String(r.id)===String(id));if(!entry)return;let route=document.getElementById('editRoute').value,user=document.getElementById('editUser').value,at=document.getElementById('editAt').value;if(entry.kind==='conferente'){let loadNumber=document.getElementById('editLoad').value.trim(),ordersCount=Number(document.getElementById('editOrders').value);if(!loadNumber||!route||!ordersCount||!user){toast('Preencha todas as informações da conferência.');return}entry.loadNumber=loadNumber;entry.order=loadNumber;entry.ordersCount=ordersCount;entry.qty=ordersCount;entry.route=route;entry.user=user}else{let order=document.getElementById('editOrder').value.trim(),qty=Number(document.getElementById('editQty').value);if(!order||!route||!qty||!user){toast('Preencha todas as informações da separação.');return}entry.order=order;entry.route=route;entry.qty=qty;entry.user=user}if(at)entry.at=new Date(at).toISOString();saveData(data);window.editingId=null;toast('Lançamento atualizado.');view='all';setTimeout(render,400)}

async function onlineOpen(profile){current={id:profile.id,name:profile.full_name,role:profile.role,active:true,mustSetPassword:profile.must_set_password!==false};await loadOnlineData();localStorage.setItem('separacao_pro_user',current.id);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');view=(current.role!=='gestor'&&current.mustSetPassword)?'firstAccess':'home';render()}
function firstAccessPage(){return `<div class="card" style="max-width:520px;margin:auto"><div class="section-title"><div><h2>Primeiro acesso</h2><div class="small">Crie sua senha pessoal para continuar no FDSAS ADM.</div></div><span class="eyebrow">${current.role}</span></div><div class="field"><label>Nova senha</label><input id="firstOnlinePassword" type="password" minlength="6" autocomplete="new-password"></div><div class="field"><label>Confirmar senha</label><input id="firstOnlinePassword2" type="password" minlength="6" autocomplete="new-password"></div><button class="primary full" onclick="completeFirstAccess()">Criar senha e entrar</button></div>`}
async function completeFirstAccess(){let a=document.getElementById('firstOnlinePassword').value,b=document.getElementById('firstOnlinePassword2').value;if(!a||a.length<6){toast('A senha deve ter pelo menos 6 caracteres.');return}if(a!==b){toast('As senhas não conferem.');return}let q=await fdsas.auth.updateUser({password:a});if(q.error){toast('Não foi possível criar a senha.');return}let done=await fdsas.rpc('complete_fdsas_first_access');if(done.error){toast('Senha criada. Falta concluir o registro do primeiro acesso.');return}current.mustSetPassword=false;view='home';toast('Senha criada com sucesso.');render()}
async function sendInvite(id,button){if(!current||current.role!=='gestor')return;let u=users.find(x=>x.id===id);if(!u){toast('Usuário não encontrado.');return}if(!u.email){toast('Adicione o e-mail em Editar antes de enviar o convite.');return}if(button){button.disabled=true;button.textContent='Enviando...'}toast('Enviando convite...');let session=(await fdsas.auth.getSession()).data.session;if(!session){if(button){button.disabled=false;button.textContent='Convite'}toast('Sua sessão expirou.');return}try{let response=await fetch(`${FDSAS_URL}/functions/v1/smart-service`,{method:'POST',headers:{'Content-Type':'application/json','apikey':FDSAS_KEY,'Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({profile_id:id})}),result=await response.json().catch(()=>({}));if(!response.ok){if(button){button.disabled=false;button.textContent='Convite'}toast(result.error||'Não foi possível enviar o convite.');return}if(button){button.textContent='Enviado';button.classList.remove('primary');button.classList.add('ghost')}toast('Convite enviado para '+u.email+'. Verifique também Spam e Promoções.')}catch(error){if(button){button.disabled=false;button.textContent='Convite'}toast('Não foi possível conectar à função de convite.')}}
function managePage(){if(current.role!=='gestor')return managerPage();let collaborators=users.filter(u=>u.role==='colaborador'),conferentes=users.filter(u=>u.role==='conferente');let userGroup=(label,list)=>`<details class="card" style="padding:0;background:transparent;box-shadow:none;border:0"><summary style="cursor:pointer;list-style:none;padding:12px 0;font-weight:800;color:#f7f7f8">${label} <span class="eyebrow">${list.length}</span><span style="float:right;color:#ff7b83">Abrir/ocultar</span></summary><div class="route-list" style="padding-bottom:10px">${list.length?list.map((u,i)=>`<div class="route-row"><b>${i+1}. ${u.name}</b><span>${u.email||'Sem e-mail'}</span><span><button class="ghost" style="padding:6px 8px" onclick="editUser('${u.id}')">Editar</button> <button class="ghost" style="padding:6px 8px" onclick="setUserPassword('${u.id}')">Senha</button> <button class="primary" data-invite-user="${u.id}" style="padding:6px 8px" onclick="sendInvite('${u.id}',this)">Convite</button> <button class="danger" style="padding:6px 8px" onclick="deleteUser('${u.id}')">Excluir</button></span></div>`).join(''):'<div class="empty" style="padding:14px">Nenhum usuário cadastrado.</div>'}</div></details>`;return `<section class="hero"><div class="eyebrow" style="color:#ffd8dc">Configurações da operação</div><h2 style="margin:7px 0 0">Cadastros e usuários</h2><p>Cadastre usuários e rotas sem ocupar a tela com listas abertas.</p></section><div class="grid layout"><div class="card"><div class="section-title"><div><h2>Cadastrar usuário</h2><div class="small">Nome e perfil são obrigatórios. E-mail pode ser incluído depois.</div></div><div class="kpi-icon">+</div></div><div class="field"><label>Nome completo</label><input id="newCollaborator" placeholder="Ex.: Ana Souza"></div><div class="field"><label>E-mail <span class="small">(opcional)</span></label><input id="newCollaboratorEmail" type="email" placeholder="nome@empresa.com"></div><div class="field"><label>Perfil</label><select id="newRole"><option value="colaborador">Colaborador — separação</option><option value="conferente">Conferente — rota e carga</option></select></div><button class="primary full" onclick="addCollaborator()">Cadastrar usuário</button><div style="margin-top:18px"><h2 style="font-size:16px">Usuários cadastrados</h2>${userGroup('Colaboradores',collaborators)}${userGroup('Conferentes',conferentes)}</div></div><div class="card"><div class="section-title"><div><h2>Cadastrar rota</h2><div class="small">Disponível nos lançamentos.</div></div><div class="kpi-icon">↗</div></div><div class="field"><label>Nome da rota</label><input id="newRoute" placeholder="Ex.: Feira de Santana"></div><button class="primary full" onclick="addRoute()">Cadastrar rota</button><details style="margin-top:18px"><summary style="cursor:pointer;font-weight:800">Rotas cadastradas <span class="eyebrow">${routes.length}</span></summary><div class="route-list" style="margin-top:12px">${routes.map((r,i)=>`<div class="route-row"><b>${i+1}. ${r}</b><span><button class="ghost" style="padding:6px 8px" onclick="editRoute('${r.replace(/'/g,"\\'")}')">Editar</button> <button class="danger" style="padding:6px 8px" onclick="deleteRoute('${r.replace(/'/g,"\\'")}')">Excluir</button></span></div>`).join('')}</div></details></div></div>`}
async function onlineInit(){let s=await fdsas.auth.getSession();if(s.data.session){let p=await fdsas.from('app_users').select('id,full_name,role,active,auth_user_id,must_set_password').or(`id.eq.${s.data.session.user.id},auth_user_id.eq.${s.data.session.user.id}`).maybeSingle();if(p.data&&p.data.active&&(!ONLY_MANAGER_ACCESS||p.data.role==='gestor'))await onlineOpen(p.data);else await fdsas.auth.signOut()}}
function logout(){fdsas.auth.signOut().finally(()=>location.reload())}
onlineInit();
</script>
