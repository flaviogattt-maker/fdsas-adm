<style>

form:none}.card:hover{transform:translateY(-2px)}}

<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">FD</div>
    <h2>FDSAS ADM</h2>
    <p>Gestão inteligente. Produção sob controle.</p>
    <div id="loginForm"><div class="field"><label>E-mail</label><input id="loginEmail" type="text" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="seu e-mail" autocomplete="username" oninput="this.dataset.typed=this.value" onchange="this.dataset.typed=this.value"></div>
    <div class="field"><label>Senha</label><input id="loginPassword" type="password" placeholder="Digite sua senha" autocomplete="current-password" oninput="this.dataset.typed=this.value" onchange="this.dataset.typed=this.value"></div>
    <div id="loginMsg" class="notice hidden"></div>
    <button class="primary full" onclick="enterApp()">Entrar no aplicativo</button></div>
    <div id="firstSetup" class="hidden"><h3 style="margin-bottom:6px">Primeiro acesso</h3><p class="small">Crie sua senha pessoal para continuar.</p><div class="field"><label>Nova senha</label><input id="firstPassword" type="password" minlength="4" placeholder="Mínimo de 4 caracteres"></div><div class="field"><label>Confirmar senha</label><input id="firstPasswordConfirm" type="password" minlength="4" placeholder="Repita sua senha"></div><button class="primary full" onclick="saveFirstPassword()">Criar minha senha</button><button class="ghost full" style="margin-top:8px" onclick="cancelFirstAccess()">Voltar</button></div>
    <p id="loginHint" class="small" style="margin-top:16px">Cada usuário cria sua própria senha no primeiro acesso.</p>
  </div>
</div>
<div id="app" class="app hidden">
  <header class="top"><div class="brand"><div class="logo">FD</div><div><h1>FDSAS ADM</h1><small>Gestão de separação e conferência</small></div></div><div class="right"><span id="userPill" class="user-pill"></span><button class="ghost" onclick="logout()">Sair</button></div></header>
  <nav id="tabs" class="tabs"></nav>
  <main id="content"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
let routes=JSON.parse(localStorage.getItem('separacao_pro_routes')||'["Balcão","Ceasa","Juazeiro","Petrolina"]');
let users=JSON.parse(localStorage.getItem('separacao_pro_users')||'[{"id":"breno","name":"Breno","role":"colaborador"},{"id":"franildo","name":"Franildo","role":"colaborador"},{"id":"jose","name":"José Vitor","role":"colaborador"},{"id":"marcelo","name":"Marcelo Costa","role":"colaborador"},{"id":"paulo","name":"Paulo","role":"colaborador"},{"id":"fabricio","name":"Fabrício","role":"conferente","mustSetPassword":true},{"id":"flavio","name":"Flávio","role":"conferente","mustSetPassword":true},{"id":"gestor","name":"Gestor","role":"gestor"}]');
let archivedUsers=JSON.parse(localStorage.getItem('separacao_pro_archived_users')||'[]');
const DEMO_PASSWORD_HASH='03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
[{id:'fabricio',name:'Fabrício',role:'conferente',mustSetPassword:true},{id:'flavio',name:'Flávio',role:'conferente',mustSetPassword:true}].forEach(seed=>{if(!users.some(u=>u.id===seed.id))users.push(seed)});
const demo=[
 ['45872','Balcão',18,'marcelo'],['45873','Ceasa',80,'marcelo'],['45874','Juazeiro',45,'marcelo'],['45875','Petrolina',62,'breno'],['45876','Ceasa',55,'breno'],['45877','Balcão',22,'franildo'],['45878','Juazeiro',71,'franildo'],['45879','Petrolina',38,'jose'],['45880','Ceasa',64,'jose'],['45881','Balcão',31,'paulo']
].map((x,i)=>({id:Date.now()-i*60000,order:x[0],route:x[1],qty:x[2],user:x[3],at:new Date(Date.now()-i*60000).toISOString()}));
let current=null, pendingUser=null, view='home';
function getData(){let x=localStorage.getItem('separacao_pro_data');if(!x){localStorage.setItem('separacao_pro_data',JSON.stringify(demo));return demo}return JSON.parse(x)}
function saveData(x){localStorage.setItem('separacao_pro_data',JSON.stringify(x))}
function userById(id){return users.find(u=>u.id===id)||archivedUsers.find(u=>u.id===id)||{id,name:'Usuário removido',role:'inativo'}}
function fmt(n){return Number(n||0).toLocaleString('pt-BR')}
function dateNow(x){return new Date(x).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function todayRows(rows){let d=new Date();return rows.filter(r=>{let x=new Date(r.at);return x.toDateString()===d.toDateString()})}
async function hashPassword(value){if(window.crypto&&crypto.subtle){let data=new TextEncoder().encode(value),hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}let h=0;for(let i=0;i<value.length;i++)h=((h<<5)-h)+value.charCodeAt(i)|0;return 'fallback-'+Math.abs(h)}

async function addCollaborator(){if(savingUser)return;savingUser=true;let button=document.querySelector('button[onclick="addCollaborator()"]');if(button){button.disabled=true;button.textContent='Salvando...'}try{let input=document.getElementById('newCollaborator'),emailInput=document.getElementById('newCollaboratorEmail'),name=input&&input.value.trim(),email=emailInput&&emailInput.value.trim().toLowerCase(),role=(document.getElementById('newRole')||{}).value;if(!name){toast('Informe o nome do usuário.');return}let existing=users.find(u=>u.name.toLowerCase()===name.toLowerCase());if(existing){if(!email){toast('Este usuário já está cadastrado. Use Editar para alterar o cadastro.');return}let updateExisting=await fdsas.from('app_users').update({email,updated_at:new Date().toISOString()}).eq('id',existing.id);if(updateExisting.error){toast('O perfil já existe, mas execute primeiro a atualização do campo de e-mail no banco.');return}await loadOnlineData();input.value='';emailInput.value='';toast('E-mail vinculado ao perfil existente.');render();return}if(!email){let id=crypto.randomUUID(),q=await fdsas.from('app_users').insert({id,full_name:name,role,must_set_password:true,active:true});if(q.error){toast('Não foi possível salvar o perfil no banco.');return}await loadOnlineData();input.value='';if(emailInput)emailInput.value='';toast('Perfil salvo. Sem e-mail, ele ficará disponível para lançamentos do gestor.');render();return}let session=(await fdsas.auth.getSession()).data.session;if(!session){toast('Sua sessão expirou. Entre novamente.');return}let response,result={};try{response=await fetch(`${FDSAS_URL}/functions/v1/admin-create-user`,{method:'POST',headers:{'Content-Type':'application/json','apikey':FDSAS_KEY,'Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({full_name:name,email,role})});result=await response.json().catch(()=>({}))}catch(error){response={ok:false};result={error:'convite indisponível'}}if(response.ok){await loadOnlineData();input.value='';emailInput.value='';toast('Convite enviado. O colaborador criará a própria senha pelo e-mail.');render();return}let id=crypto.randomUUID(),fallback=await fdsas.from('app_users').insert({id,full_name:name,email,role,must_set_password:true,active:true});if(fallback.error){let basic=await fdsas.from('app_users').insert({id,full_name:name,role,must_set_password:true,active:true});if(basic.error){toast(result.error||'Não foi possível salvar o perfil.');return}toast('Perfil salvo, mas o e-mail precisa ser ativado no banco antes do convite.')}else toast('Perfil salvo com e-mail. O convite será enviado quando a função de convite estiver ativa.');await loadOnlineData();input.value='';emailInput.value='';render()}catch(error){toast('Não foi possível concluir o cadastro. Tente novamente.')}finally{savingUser=false;let b=document.querySelector('button[onclick="addCollaborator()"]');if(b){b.disabled=false;b.textContent='Cadastrar usuário'}}}
async function editRoute(name){if(!current||current.role!=='gestor')return;let old=String(name),next=prompt('Digite o novo nome da rota:',old);if(next===null)return;next=next.trim();if(!next||next===old){return}if(routes.some(r=>r.toLowerCase()===next.toLowerCase())){toast('Já existe uma rota com esse nome.');return}let id=routeIdByName[old];if(!id){toast('Rota não encontrada no banco.');return}let q=await fdsas.from('routes').update({name:next}).eq('id',id);if(q.error){toast('Não foi possível editar a rota.');return}toast('Rota atualizada.');await loadOnlineData();render()}
async function deleteRoute(name){if(!current||current.role!=='gestor')return;let old=String(name);if(!confirm('Excluir a rota '+old+'? Ela será desativada para novos lançamentos e o histórico será preservado.'))return;let id=routeIdByName[old];if(!id){toast('Rota não encontrada no banco.');return}let q=await fdsas.from('routes').update({active:false}).eq('id',id);if(q.error){toast('Não foi possível excluir a rota.');return}toast('Rota excluída dos novos lançamentos. O histórico foi preservado.');await loadOnlineData();render()}
async function editUser(id){if(!current||current.role!=='gestor')return;let u=users.find(x=>x.id===id);if(!u||u.role==='gestor'&&u.id===current.id){toast('Este usuário não pode ser alterado nesta tela.');return}let next=prompt('Digite o novo nome do usuário:',u.name);if(next===null)return;next=next.trim();if(!next)return;if(users.some(x=>x.id!==id&&x.name.toLowerCase()===next.toLowerCase())){toast('Já existe outro usuário com esse nome.');return}let email=prompt('Digite ou deixe em branco o e-mail do usuário:',u.email||'');if(email===null)return;email=email.trim().toLowerCase()||null;let q=await fdsas.from('app_users').update({full_name:next,email:email,updated_at:new Date().toISOString()}).eq('id',id);if(q.error){toast('Execute primeiro a atualização do campo de e-mail no banco.');return}toast(email?'Usuário e e-mail atualizados.':'Usuário atualizado sem e-mail.');await loadOnlineData();render()}
async function deleteUser(id){if(!current||current.role!=='gestor')return;let u=users.find(x=>x.id===id);if(!u||u.id===current.id||u.role==='gestor'){toast('O gestor principal não pode ser excluído.');return}if(!confirm('Desativar '+u.name+'? O histórico será preservado.'))return;let q=await fdsas.from('app_users').update({active:false,updated_at:new Date().toISOString()}).eq('id',id);if(q.error){toast('Não foi possível desativar o usuário.');return}toast('Usuário desativado. O histórico foi preservado.');await loadOnlineData();render()}
async function setUserPassword(id){if(!current||current.role!=='gestor')return;toast('Verificando o e-mail do usuário...');let u=users.find(x=>x.id===id);if(!u){toast('Usuário não encontrado.');return}if(!u.email){toast('Este usuário ainda não possui e-mail. Use Editar para informar um.');return}let q=await fdsas.auth.resetPasswordForEmail(u.email);if(q.error){toast('Não foi possível enviar o link. Confira se o e-mail está salvo e se o usuário Auth existe.');return}toast('Link de redefinição enviado para o e-mail do usuário.')}
async function enterApp(){try{loginMessage('Verificando acesso...',true);let emailInput=document.getElementById('loginEmail'),passwordInput=document.getElementById('loginPassword'),email=((emailInput&&emailInput.value)||(emailInput&&emailInput.dataset.typed)||'').trim(),password=(passwordInput&&passwordInput.value)||(passwordInput&&passwordInput.dataset.typed)||'';if(!email)email=(window.prompt('Digite o e-mail do gestor:')||'').trim();if(!password)password=window.prompt('Digite a senha do gestor:')||'';if(!email||!password){loginMessage('Informe seu e-mail e sua senha.');return}let auth=await fdsas.auth.signInWithPassword({email,password});if(auth.error){loginMessage('Não foi possível entrar. Confira o e-mail e a senha.');return}let profile=await fdsas.from('app_users').select('id,full_name,role,active,auth_user_id').or(`id.eq.${auth.data.user.id},auth_user_id.eq.${auth.data.user.id}`).maybeSingle();if(profile.error||!profile.data||!profile.data.active){await fdsas.auth.signOut();loginMessage('Usuário autenticado, mas ainda não está cadastrado no FDSAS ADM.');return}if(ONLY_MANAGER_ACCESS&&profile.data.role!=='gestor'){await fdsas.auth.signOut();loginMessage('Por enquanto, somente o gestor possui acesso ao aplicativo.');return}await onlineOpen(profile.data)}catch(error){loginMessage('O aplicativo encontrou um erro ao iniciar. Feche este arquivo, baixe a versão mais recente e tente novamente.');console.error(error)}}
async function onlineOpen(profile){current={id:profile.id,name:profile.full_name,role:profile.role,active:true};await loadOnlineData();localStorage.setItem('separacao_pro_user',current.id);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
async function sendInvite(id,button){if(!current||current.role!=='gestor')return;let u=users.find(x=>x.id===id);if(!u){toast('Usuário não encontrado.');return}if(!u.email){toast('Adicione o e-mail em Editar antes de enviar o convite.');return}if(button){button.disabled=true;button.textContent='Enviando...'}toast('Enviando convite...');let session=(await fdsas.auth.getSession()).data.session;if(!session){if(button){button.disabled=false;button.textContent='Convite'}toast('Sua sessão expirou.');return}try{let response=await fetch(`${FDSAS_URL}/functions/v1/smart-service`,{method:'POST',headers:{'Content-Type':'application/json','apikey':FDSAS_KEY,'Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({profile_id:id})}),result=await response.json().catch(()=>({}));if(!response.ok){if(button){button.disabled=false;button.textContent='Convite'}toast(result.error||'Não foi possível enviar o convite.');return}if(button){button.textContent='Enviado';button.classList.remove('primary');button.classList.add('ghost')}toast('Convite enviado para '+u.email+'. Verifique também Spam e Promoções.')}catch(error){if(button){button.disabled=false;button.textContent='Convite'}toast('Não foi possível conectar à função de convite.')}}
function managePage(){if(current.role!=='gestor')return managerPage();let collaborators=users.filter(u=>u.role==='colaborador'),conferentes=users.filter(u=>u.role==='conferente');let userGroup=(label,list)=>`<details class="card" style="padding:0;background:transparent;box-shadow:none;border:0"><summary style="cursor:pointer;list-style:none;padding:12px 0;font-weight:800;color:#f7f7f8">${label} <span class="eyebrow">${list.length}</span><span style="float:right;color:#ff7b83">Abrir/ocultar</span></summary><div class="route-list" style="padding-bottom:10px">${list.length?list.map((u,i)=>`<div class="route-row"><b>${i+1}. ${u.name}</b><span>${u.email||'Sem e-mail'}</span><span><button class="ghost" style="padding:6px 8px" onclick="editUser('${u.id}')">Editar</button> <button class="ghost" style="padding:6px 8px" onclick="setUserPassword('${u.id}')">Senha</button> <button class="primary" data-invite-user="${u.id}" style="padding:6px 8px" onclick="sendInvite('${u.id}',this)">Convite</button> <button class="danger" style="padding:6px 8px" onclick="deleteUser('${u.id}')">Excluir</button></span></div>`).join(''):'<div class="empty" style="padding:14px">Nenhum usuário cadastrado.</div>'}</div></details>`;return `<section class="hero"><div class="eyebrow" style="color:#ffd8dc">Configurações da operação</div><h2 style="margin:7px 0 0">Cadastros e usuários</h2><p>Cadastre usuários e rotas sem ocupar a tela com listas abertas.</p></section><div class="grid layout"><div class="card"><div class="section-title"><div><h2>Cadastrar usuário</h2><div class="small">Nome e perfil são obrigatórios. E-mail pode ser incluído depois.</div></div><div class="kpi-icon">+</div></div><div class="field"><label>Nome completo</label><input id="newCollaborator" placeholder="Ex.: Ana Souza"></div><div class="field"><label>E-mail <span class="small">(opcional)</span></label><input id="newCollaboratorEmail" type="email" placeholder="nome@empresa.com"></div><div class="field"><label>Perfil</label><select id="newRole"><option value="colaborador">Colaborador — separação</option><option value="conferente">Conferente — rota e carga</option></select></div><button class="primary full" onclick="addCollaborator()">Cadastrar usuário</button><div style="margin-top:18px"><h2 style="font-size:16px">Usuários cadastrados</h2>${userGroup('Colaboradores',collaborators)}${userGroup('Conferentes',conferentes)}</div></div><div class="card"><div class="section-title"><div><h2>Cadastrar rota</h2><div class="small">Disponível nos lançamentos.</div></div><div class="kpi-icon">↗</div></div><div class="field"><label>Nome da rota</label><input id="newRoute" placeholder="Ex.: Feira de Santana"></div><button class="primary full" onclick="addRoute()">Cadastrar rota</button><details style="margin-top:18px"><summary style="cursor:pointer;font-weight:800">Rotas cadastradas <span class="eyebrow">${routes.length}</span></summary><div class="route-list" style="margin-top:12px">${routes.map((r,i)=>`<div class="route-row"><b>${i+1}. ${r}</b><span><button class="ghost" style="padding:6px 8px" onclick="editRoute('${r.replace(/'/g,"\\'")}')">Editar</button> <button class="danger" style="padding:6px 8px" onclick="deleteRoute('${r.replace(/'/g,"\\'")}')">Excluir</button></span></div>`).join('')}</div></details></div></div>`}
async function onlineInit(){let s=await fdsas.auth.getSession();if(s.data.session){let p=await fdsas.from('app_users').select('id,full_name,role,active,auth_user_id').or(`id.eq.${s.data.session.user.id},auth_user_id.eq.${s.data.session.user.id}`).maybeSingle();if(p.data&&p.data.active&&(!ONLY_MANAGER_ACCESS||p.data.role==='gestor'))await onlineOpen(p.data);else await fdsas.auth.signOut()}}
function logout(){fdsas.auth.signOut().finally(()=>location.reload())}
onlineInit();
</script>
