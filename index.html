/* acabamento visual sofisticado */

.pie-layout{display:flex;align-items:center;justify-content:center;gap:24px;min-height:180px;padding:8px 4px}.pie-chart{width:178px;height:178px;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:0 0 0 1px #ffffff18,0 12px 25px #00000088}.pie-chart:after{content:'';position:absolute;inset:25px;border-radius:50%;background:#09090b;box-shadow:inset 0 1px #ffffff0b}.pie-center{position:relative;z-index:1;text-align:center;display:grid;gap:2px}.pie-center b{font-size:25px;color:#f7f7f8}.pie-center span{font-size:11px;color:#a1a1aa}.pie-legend{display:grid;gap:9px;min-width:145px}.pie-legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;font-size:12px}.pie-legend-row i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px #ffffff22}.pie-legend-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6d6db}.pie-legend-row b{color:#f7f7f8}@media(max-width:520px){.pie-layout{gap:15px}.pie-chart{width:145px;height:145px}.pie-chart:after{inset:21px}.pie-legend{min-width:120px}}

/* FDSAS ADM — camada visual da reformulação V1 (prévia, não publicada) */
:root{--surface:#0d0f12;--surface-2:#13161a;--line-soft:#292e35;--text-soft:#c8cbd1;--focus:#ff5a65}
html,body{overflow-x:hidden;min-width:0}
body{background:radial-gradient(circle at 100% -10%,#25070d 0,transparent 32%),#050607;letter-spacing:.005em}
.app{max-width:1240px;padding:clamp(12px,2vw,24px)}
.card,.hero,.login-card{box-shadow:0 10px 28px rgba(0,0,0,.34);transform:none}
.card:hover{transform:none;box-shadow:0 12px 30px rgba(0,0,0,.45);border-color:#553139}
button{min-height:44px;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ff596633;outline-offset:2px}
.tabs{scrollbar-width:thin;scrollbar-color:#74222b transparent}
.section-title{gap:12px}
.small{line-height:1.45}
/* inteligência operacional calculada sobre o mesmo período do dashboard */

function fmt(n){return Number(n||0).toLocaleString('pt-BR')}
function shortPersonName(name){let text=String(name||'');if(text.length<=20)return text;let parts=text.trim().split(/\s+/);return parts.length>1?parts[0]+' '+parts[parts.length-1].charAt(0)+'.':text.slice(0,19)+'…'}

function todayRows(rows){let d=new Date();return rows.filter(r=>{let x=new Date(r.at);return x.toDateString()===d.toDateString()})}
async function hashPassword(value){if(window.crypto&&crypto.subtle){let data=new TextEncoder().encode(value),hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}let h=0;for(let i=0;i<value.length;i++)h=((h<<5)-h)+value.charCodeAt(i)|0;return 'fallback-'+Math.abs(h)}

function render(){var oldFrozen=document.getElementById('content');if(oldFrozen)oldFrozen.classList.remove('dashboard-frozen');var topWasOpen=!!(document.getElementById('topOverviewFold')&&document.getElementById('topOverviewFold').open);document.getElementById('userPill').textContent=current.name;let tabs=current.role==='gestor'?[['home','Painel'],['dashboard','Dashboard'],['team','Equipe'],['approvals','Aprovações'],['manage','Cadastros']]:[];let pendingBadge=current.role==='gestor'?getData().filter(r=>r.kind!=='conferente'&&r.approvalStatus==='pending').length:0;document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab ${view===t[0]?'active':''}" onclick="${t[0]==='dashboard'?'openDashboard()':t[0]==='team'?'openTeamPanel()':"go('"+t[0]+"')"}">${t[1]}${t[0]==='approvals'&&pendingBadge?`<span class="nav-badge">${pendingBadge}</span>`:''}</button>`).join('');let c=document.getElementById('content');if(view==='firstAccess')c.innerHTML=firstAccessPage();else if(view==='resetPassword')c.innerHTML=resetPasswordPage();else if(view==='new')c.innerHTML=newForm();else if(view==='mine')c.innerHTML=minePage();else if(view==='all')c.innerHTML=current.role==='gestor'?allPage():workerPage();else if(view==='approvals')c.innerHTML=current.role==='gestor'?approvalPage():workerPage();else if(view==='conferenteAll')c.innerHTML=current.role==='gestor'?conferenteAllPage():workerPage();else if(view==='edit')c.innerHTML=current.role==='gestor'?editPage():workerPage();else if(view==='manage')c.innerHTML=current.role==='gestor'?managePage():workerPage();else if(view==='team')c.innerHTML=current.role==='gestor'?managerTeamPageV60():workerPage();else if(view==='dashboard')c.innerHTML=current.role==='gestor'?dashboardHubPage():workerPage();else if(view==='dashboardConf')c.innerHTML=current.role==='gestor'?dashboardHubPage():workerPage();else c.innerHTML=current.role==='gestor'?managerPage():workerPage();var topFold=document.getElementById('topOverviewFold'),topPanel=document.getElementById('topOverviewPanel'),sourceHeader=c.querySelector('.overview-header-inner'),showTop=current.role==='gestor'&&(view==='home'||view==='dashboard');if(topFold)topFold.style.display=showTop?'block':'none';if(topPanel)topPanel.innerHTML=showTop?(view==='home'&&sourceHeader?sourceHeader.innerHTML:header('Relatórios gerais','Escolha o painel e ajuste o período da operação.')):'';if(topFold&&showTop&&topWasOpen)topFold.open=true;if(view==='dashboard'&&dashboardOpenPanel){let target=document.getElementById('dashpanel-'+dashboardOpenPanel);if(target){try{target.innerHTML=dashboardPanelContent(dashboardOpenPanel);var innerHeader=target.querySelector('.clean-header');if(innerHeader)innerHeader.style.display='none'}catch(e){console.error(e);target.innerHTML='<div class=\"notice\">Não foi possível carregar este painel agora. Atualize a página e tente novamente.</div>'}}}if(current.role==='colaborador'&&emergencyAlert)c.insertAdjacentHTML('beforeend',emergencyAlertOverlay());startEmergencyPolling();startOnlineDataPolling();setTimeout(function(){startFeedbackCarousel();startCommunicationCarousel();setupManagerCollapsibles();if(typeof setupDashboardReportCollapse==='function')setupDashboardReportCollapse()},120)}
function go(v){if(view===v)return;view=v;render()}

function stats(rows){return {orders:rows.length,qty:rows.reduce((a,r)=>a+Number(r.qty||0),0)}}
function normalizeOrderCode(value){return String(value||'').trim().toUpperCase()}
function duplicateSituationPrompt(order,qty,otherName){return new Promise(resolve=>{let box=document.createElement('div');box.className='emergency-overlay';box.style.zIndex='3500';box.innerHTML='<div class="emergency-box" style="text-align:left;max-width:520px"><div class="emergency-title" style="font-size:20px">⚠️ ATENÇÃO: pedido já lançado</div><p style="font-size:16px;line-height:1.45">O pedido <b>'+order+'</b>, com <b>'+fmt(qty)+' und.</b>, já foi lançado por <b>'+otherName+'</b>.</p><p>Informe como esse pedido foi separado:</p><label style="display:block;padding:10px;margin:8px 0;border:1px solid #6d2932;border-radius:8px"><input type="radio" name="duplicateSituation" value="divided"> Dividimos o pedido</label><label style="display:block;padding:10px;margin:8px 0;border:1px solid #6d2932;border-radius:8px"><input type="radio" name="duplicateSituation" value="together"> Separamos juntos</label><label style="display:block;padding:10px;margin:8px 0;border:1px solid #6d2932;border-radius:8px"><input type="radio" name="duplicateSituation" value="alone"> Separei sozinho</label><label style="display:block;padding:10px;margin:8px 0;border:1px solid #6d2932;border-radius:8px"><input type="radio" name="duplicateSituation" value="cancel"> Desistir do lançamento</label><div style="display:flex;gap:8px;margin-top:14px"><button type="button" class="ghost" id="cancelDuplicate">Voltar</button><button type="button" class="emergency-accept" id="confirmDuplicate">Continuar</button></div></div>';document.body.appendChild(box);let finish=function(value){box.remove();resolve(value)};box.querySelector('#cancelDuplicate').onclick=function(){finish(null)};box.querySelector('#confirmDuplicate').onclick=function(){let selected=box.querySelector('input[name="duplicateSituation"]:checked');if(!selected){toast('Selecione uma das opções para continuar.');return}finish(selected.value)}})}
function productionSeparationRows(rows){let seen={};return rows.filter(r=>r.kind!=='conferente'&&r.approvalStatus!=='pending'&&r.approvalStatus!=='rejected').filter(r=>{let key=normalizeOrderCode(r.order)+'|'+Number(r.qty||0)+'|'+r.user;if(seen[key])return false;seen[key]=true;return true})}
function separationDashboardBase(rows){return productionSeparationRows(rows||periodRows())}
function separationTodayBase(){return separationDashboardBase(todayRows(getData()))}
function ranking(rows){return managerUserRows(rows||separationTodayBase()).map(x=>[x.user.id,x.orders])}
function greetingText(){let h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function motivationalText(){let messages=['Você está fazendo um ótimo trabalho. Continue nesse ritmo!','Cada registro bem feito ajuda a operação a funcionar melhor.','Seu empenho faz diferença no resultado da equipe.','Foco, organização e constância: você está no caminho certo.'];return messages[new Date().getDate()%messages.length]}
function rankMedal(pos){return pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':''}
function todayPosition(rank,userId){let i=rank.findIndex(x=>x[0]===userId);return i>=0&&Number(rank[i][1])>0?i+1:0}
function rankDisplay(pos){return pos?rankMedal(pos)+' '+pos+'º':'—'}
function conferenceRanking(rows){let map={};rows.filter(r=>r.kind==='conferente').forEach(r=>{map[r.user]=(map[r.user]||0)+Number(r.ordersCount||r.qty||0)});return Object.entries(map).sort((a,b)=>b[1]-a[1])}
function conferenteFeedback(rows,st,pos){let mine=getData().filter(r=>r.user===current.id&&r.kind==='conferente'),today=new Date().toDateString(),days={};mine.filter(r=>new Date(r.at).toDateString()!==today).forEach(r=>{let d=new Date(r.at).toDateString();days[d]=(days[d]||0)+Number(r.ordersCount||r.qty||0)});let vals=Object.values(days),avg=vals.length?vals.reduce((a,v)=>a+v,0)/vals.length:0,routeMap={};rows.forEach(r=>{routeMap[r.route]=(routeMap[r.route]||0)+Number(r.ordersCount||r.qty||0)});let top=Object.entries(routeMap).sort((a,b)=>b[1]-a[1])[0],feedback=avg?st.orders>=avg?`Você está acima da sua média recente de ${fmt(Math.round(avg))} pedido(s) conferido(s) por dia. Continue mantendo esse ritmo.`:`Hoje você conferiu ${fmt(st.orders)} pedido(s), enquanto sua média recente é ${fmt(Math.round(avg))}. Busque manter uma sequência constante durante o turno.`:`Seu resultado de hoje vai formar sua média pessoal nos próximos dias.`;return `<details class="card ai-card" style="margin:15px 0"><summary class="ai-header" style="cursor:pointer;list-style:none"><div class="ai-title"><div class="ai-mark">IA</div><div><h2>Seu feedback de hoje</h2><p>Toque para abrir sua análise automática</p></div></div><span class="pill">${pos?rankMedal(pos)+' '+pos+'º lugar':'Sem posição hoje'} · Abrir</span></summary><div class="ai-list"><div class="ai-insight"><div><b>${feedback}</b><span>Você registrou ${fmt(st.loads)} carga(s) e conferiu ${fmt(st.orders)} pedido(s) hoje.</span></div></div>${top?`<div class="ai-insight"><div><b>Seu maior volume foi na rota ${top[0]}.</b><span>Foram ${fmt(top[1])} pedido(s) conferido(s) nessa rota.</span></div></div>`:''}<div class="ai-insight"><div><b>Próximo foco: precisão e consistência.</b><span>Registre cada carga no momento da conferência para manter seus indicadores atualizados.</span></div></div></div></details>`}
function conferentePage(){let rows=todayRows(getData()).filter(r=>r.user===current.id&&r.kind==='conferente'),st={loads:rows.length,orders:rows.reduce((a,r)=>a+Number(r.ordersCount||r.qty||0),0)},rank=conferenceRanking(todayRows(getData())),pos=onlineRankingLoaded?onlineRanking.position:0;return `<section class="hero"><div class="small" style="color:#ffd8dc">${greetingText()}, ${current.name}!</div><h2 style="margin:6px 0 0">Registros de conferência</h2><p>${motivationalText()}</p></section>${publishedCommunicationForUser()}<div class="grid cards"><div class="card"><div class="label">Cargas registradas</div><div class="metric">${fmt(st.loads)}</div></div><div class="card"><div class="label">Pedidos conferidos</div><div class="metric">${fmt(st.orders)}</div></div><div class="card"><div class="label">Rotas atendidas</div><div class="metric">${fmt(new Set(rows.map(r=>r.route)).size)}</div></div><div class="card"><div class="label">Último registro</div><div class="metric" style="font-size:20px">${rows.length?dateNow(rows.slice().sort((a,b)=>b.id-a.id)[0].at):'—'}</div></div></div>${eveningGeneralRanking('conferente')}<div class="card" style="margin-top:15px"><div class="label">Sua posição no ranking</div><div class="rank">${rankDisplay(pos)}</div><div class="rank-sub">ranking de pedidos conferidos hoje</div></div>${conferenteFeedback(rows,st,pos)}<div class="grid layout" style="margin-top:15px"><div class="card"><div class="section-title"><h2>Resumo por rota</h2><button class="primary" onclick="go('new')">+ Novo registro</button></div>${routeSummaryConferente(rows)}</div><div class="card"><div class="section-title"><h2>Histórico de registros</h2></div>${conferenteRecent(rows)}</div></div>${monthlyReportForUser()}`}

function conferenteRecent(rows){if(!rows.length)return '<div class="empty">Nenhuma carga registrada.</div>';return '<div class="table-wrap"><table class="table"><tr><th>Carga</th><th>Rota</th><th>Pedidos</th><th>Horário</th></tr>'+rows.slice().sort((a,b)=>b.id-a.id).slice(0,8).map(r=>`<tr><td>${r.loadNumber||r.order}</td><td>${r.route}</td><td>${fmt(r.ordersCount||r.qty)}</td><td>${dateNow(r.at)}</td></tr>`).join('')+'</table></div>'}

function workerPage(){if(current.role==='conferente')return conferentePage();let rows=todayRows(getData()).filter(r=>r.user===current.id), all=getData().filter(r=>r.user===current.id), st=stats(rows), rank=ranking(todayRows(getData())), pos=onlineRankingLoaded?onlineRanking.position:0;return `<section class="hero"><div class="small" style="color:#ffd8dc">${greetingText()}, ${current.name}!</div><h2 style="margin:6px 0 0">Seu resumo de hoje</h2><p>${motivationalText()}</p></section><div class="grid cards"><div class="card"><div class="label">Sua posição</div><div class="rank">${rankDisplay(pos)}</div><div class="rank-sub">ranking de pedidos hoje</div></div><div class="card"><div class="label">Pedidos separados</div><div class="metric">${fmt(st.orders)}</div><div class="small">hoje</div></div><div class="card"><div class="label">Unidades separadas</div><div class="metric">${fmt(st.qty)}</div><div class="small">hoje</div></div><div class="card"><div class="label">Rotas no dia</div><div class="metric">${fmt(new Set(rows.map(r=>r.route)).size)}</div><div class="small">rotas atendidas hoje</div></div></div>${workerFeedback(rows,st,rank,pos)}<div class="grid layout" style="margin-top:15px"><div class="card"><div class="section-title"><h2>Produção por rota</h2><button class="primary" onclick="go('new')">+ Nova separação</button></div>${routeSummary(rows)}</div><div class="card"><div class="section-title"><h2>Histórico de lançamentos</h2></div>${recent(rows)}</div></div>`}

function slugify(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}

    else if(mode==='week'){end=new Date(start);end.setDate(end.getDate()+1);start.setDate(start.getDate()-6);previousEnd=new Date(start);previousStart=new Date(start);previousStart.setDate(previousStart.getDate()-7)}

    else if(mode==='custom'&&typeof managerStartDate!=='undefined'&&managerStartDate){var bits=String(managerStartDate).split('-');start=new Date(Number(bits[0]),Number(bits[1])-1,Number(bits[2]));var endBits=String((typeof managerEndDate!=='undefined'&&managerEndDate)||managerStartDate).split('-');end=new Date(Number(endBits[0]),Number(endBits[1])-1,Number(endBits[2])+1);var span=end-start;previousEnd=new Date(start);previousStart=new Date(start.getTime()-span)}

    var routesList=Object.keys(routeMap).sort(function(a,b){return routeMap[b]-routeMap[a]}),usersList=Object.keys(userMap).sort(function(a,b){return userMap[b]-userMap[a]}),topRoute=routesList[0],topRouteCount=routeMap[topRoute],share=topRouteCount/all.length*100;

/* FDSAS ADM — operações remotas com confirmação real (V2) */
(function(){
  async function audit(action,type,id,details){
    try{
      if(typeof onlineReady==='undefined'||!onlineReady||!current)return;
      await fdsas.from('audit_logs').insert({actor_id:current.id,action:action,entity_type:type,entity_id:id||null,details:details||{}});
    }catch(error){console.warn('Auditoria não registrada')}
  }
  window.deleteEntry=async function(id){
    if(!current||current.role!=='gestor')return;
    var data=getData(),entry=data.find(function(item){return String(item.id)===String(id)});
    if(!entry)return;
    if(!window.confirm('Excluir este lançamento permanentemente?'))return;
    if(!onlineReady){toast('Não foi possível excluir: o aplicativo está sem conexão com o Supabase.');return}
    var table=entry.kind==='conferente'?'conference_entries':'separation_entries';
    var query=await fdsas.from(table).delete().eq('id',entry.remoteId||entry.id);
    if(query.error){toast('Não foi possível excluir o lançamento. Nenhuma alteração foi confirmada.');return}
    await audit('delete',table,entry.remoteId||entry.id,{source:'manager'});
    await loadOnlineData();
    toast('Lançamento excluído do banco online.');
    render();
  };
  window.saveEdit=async function(){
    if(!current||current.role!=='gestor')return;
    var id=window.editingId,data=getData(),entry=data.find(function(item){return String(item.id)===String(id)});
    if(!entry)return;
    var routeEl=document.getElementById('editRoute'),userEl=document.getElementById('editUser'),atEl=document.getElementById('editAt');
    var route=routeEl&&routeEl.value,user=userEl&&userEl.value,at=atEl&&atEl.value;
    if(!route||!user){toast('Preencha rota e responsável.');return}
    if(!onlineReady){toast('Não foi possível editar: o aplicativo está sem conexão com o Supabase.');return}
    var isoDate=at?new Date(at).toISOString():entry.at;
    var table,payload,duplicate;
    if(entry.kind==='conferente'){
      var loadEl=document.getElementById('editLoad'),ordersEl=document.getElementById('editOrders');
      var load=loadEl&&loadEl.value.trim(),orders=Number(ordersEl&&ordersEl.value);
      if(!load||!Number.isFinite(orders)||orders<1){toast('Informe uma carga e uma quantidade válida.');return}
      duplicate=await fdsas.from('conference_entries').select('id').eq('load_code',load).neq('id',entry.remoteId||entry.id).limit(1);
      if(duplicate.error){toast('Não foi possível validar a carga. Tente novamente.');return}
      if(duplicate.data&&duplicate.data.length){toast('Esta carga já existe e não pode ser duplicada.');return}
      table='conference_entries';payload={load_code:load,conferente_id:user,route_id:routeUuid(route),order_count:orders,created_at:isoDate,updated_at:new Date().toISOString()};
    }else{
      var orderEl=document.getElementById('editOrder'),qtyEl=document.getElementById('editQty');
      var order=orderEl&&orderEl.value.trim(),qty=Number(qtyEl&&qtyEl.value);
      if(!order||!Number.isFinite(qty)||qty<=0){toast('Informe pedido e quantidade válidos.');return}
      var localConflict=data.some(function(item){return item.kind!=='conferente'&&String(item.id)!==String(entry.id)&&item.user===user&&String(item.order).trim().toLowerCase()===order.toLowerCase()&&Number(item.qty)===qty&&item.approvalStatus!=='rejected'});
      if(localConflict){toast('Este pedido com esta quantidade já pertence ao colaborador selecionado.');return}
      table='separation_entries';payload={order_code:order,collaborator_id:user,route_id:routeUuid(route),quantity:qty,created_at:isoDate,updated_at:new Date().toISOString()};
    }
    var query=await fdsas.from(table).update(payload).eq('id',entry.remoteId||entry.id).select('id').single();

})();
